<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>zwift-2 · PoC connexion home trainer</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1>PoC · connexion home trainer</h1>
      <p id="support" class="note"></p>

      <section class="row">
        <button id="connect-ble">Connecter (Bluetooth)</button>
        <button id="connect-sim" class="secondary">Trainer simulé</button>
        <button id="disconnect" class="secondary" disabled>Déconnecter</button>
        <span id="state" class="pill">trainer : déconnecté</span>
      </section>

      <section class="row">
        <button id="connect-hr" class="secondary">Ceinture cardio</button>
        <button id="disconnect-hr" class="secondary" disabled>Déconnecter</button>
        <span id="state-hr" class="pill">cardio : déconnecté</span>
      </section>

      <section class="metrics">
        <div><span id="m-power">–</span><label>W</label></div>
        <div><span id="m-cadence">–</span><label>rpm</label></div>
        <div><span id="m-speed">–</span><label>km/h</label></div>
        <div><span id="m-hr">–</span><label>bpm</label></div>
        <div><span id="m-distance">–</span><label>m</label></div>
        <div><span id="m-rate">–</span><label>trames/s</label></div>
      </section>

      <section>
        <h2>Sortie virtuelle · parcours « Colline », 6 km en boucle</h2>
        <div class="row">
          <label for="mass">Masse cycliste + vélo</label>
          <input id="mass" type="number" min="30" max="200" step="1" value="80" />
          <span>kg</span>
          <button id="ride-toggle" disabled>Démarrer la sortie</button>
        </div>
        <div class="metrics">
          <div><span id="r-speed">–</span><label>km/h virtuels</label></div>
          <div><span id="r-dist">–</span><label>km</label></div>
          <div><span id="r-grade">–</span><label>% pente</label></div>
          <div><span id="r-alt">–</span><label>m altitude</label></div>
          <div><span id="r-time">–</span><label>temps</label></div>
        </div>
        <p class="note">La puissance mesurée fait avancer le modèle physique ; la pente du parcours est envoyée au trainer en mode SIM.</p>
      </section>

      <section class="controls">
        <h2>Pilotage manuel</h2>
        <div class="row">
          <label for="erg">ERG, puissance cible</label>
          <input id="erg" type="number" min="0" max="1000" step="5" value="150" />
          <span>W</span>
          <button id="erg-send" disabled>Envoyer</button>
        </div>
        <div class="row">
          <label for="grade">SIM, pente</label>
          <input id="grade" type="range" min="-10" max="20" step="0.5" value="0" />
          <output id="grade-out">0 %</output>
          <button id="sim-send" disabled>Envoyer</button>
        </div>
        <p id="caps" class="note"></p>
      </section>

      <section>
        <h2>Journal</h2>
        <pre id="log"></pre>
        <button id="copy-log" class="secondary">Copier le journal</button>
        <button id="export-fit" class="secondary" disabled>Exporter FIT</button>
        <button id="export-strava" class="secondary" hidden>Envoyer à Strava</button>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
